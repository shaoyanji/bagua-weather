[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bagua-weather"
version = "0.1.0"
description = "8-state Markov regime model of weather for energy risk, built on open DWD data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "requests", "pvlib", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
m4 = ["scikit-learn"]  # M4 stronger-baseline extra (GBM)

[project.scripts]
bagua = "bagua_weather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
